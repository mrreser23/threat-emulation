id: ffe6dcaa-c6d0-4826-b174-c2eef561b0e7
name: apt29-energy-2026
description: Sous-ensemble PoC du profil APT29 : execution, persistance, injection, dump LSASS, mouvement lateral RDP, exfiltration via canal C2
objective: 495a9828-cab1-44dd-a0ca-66e58177d8cc
atomic_ordering:
- 8cb64f4c-f6ce-4b92-ab6e-a7de0d934136
- 873310f1-5e84-45ae-bcc9-9552916fe8aa
- a34012fc-f8cf-4090-8cb3-8c1e5d5e80b1
- 10a5aa35-7908-4b90-b2f2-3a4d6169989a
